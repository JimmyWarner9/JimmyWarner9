<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 72" width="640" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.b{transform-box:fill-box;transform-origin:bottom;animation:eq 1s steps(5) infinite alternate}
.b1{animation-duration:.7s}.b2{animation-duration:1.1s;animation-delay:-.3s}.b3{animation-duration:.9s;animation-delay:-.6s}
.b4{animation-duration:1.3s;animation-delay:-.2s}.b5{animation-duration:.8s;animation-delay:-.5s}.b6{animation-duration:1s;animation-delay:-.8s}
@keyframes eq{0%{transform:scaleY(.2)}100%{transform:scaleY(1)}}
.bl{animation:bl 1s steps(1) infinite}
@keyframes bl{0%{opacity:1}50%{opacity:.2}}
text{font-family:'Courier New',monospace;font-weight:bold}
</style>
<g transform="scale(8)">
<rect width="50" height="9" fill="#161b22"/>
<rect width="50" height="1" fill="#1DB954"/>
<rect y="8" width="50" height="1" fill="#1DB954"/>
<rect width="1" height="9" fill="#1DB954"/>
<rect x="49" width="1" height="9" fill="#1DB954"/>
<rect class="b b1" x="3" y="2" width="1" height="5" fill="#1DB954"/>
<rect class="b b2" x="5" y="2" width="1" height="5" fill="#58a6ff"/>
<rect class="b b3" x="7" y="2" width="1" height="5" fill="#1DB954"/>
<rect class="b b4" x="9" y="2" width="1" height="5" fill="#58a6ff"/>
<rect class="b b5" x="11" y="2" width="1" height="5" fill="#1DB954"/>
<rect class="b b6" x="13" y="2" width="1" height="5" fill="#58a6ff"/>
<text x="16" y="3.6" font-size="1.4" fill="#1DB954">NOW PLAYING</text>
<text x="16" y="5.6" font-size="1.8" fill="#f0f6fc">MY SPOTIFY PLAYLIST</text>
<text class="bl" x="16" y="7.3" font-size="1.2" fill="#8b949e">TAP TO LISTEN</text>
<!-- play button -->
<rect x="42" y="2" width="1" height="5" fill="#1DB954"/>
<rect x="43" y="3" width="1" height="3" fill="#1DB954"/>
<rect x="44" y="4" width="1" height="1" fill="#1DB954"/>
</g>
</svg>
