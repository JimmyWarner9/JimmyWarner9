<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="800" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.bob{animation:bob .8s steps(1) infinite}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(1px)}}
.tw{animation:tw 2s steps(1) infinite}
.tw2{animation:tw 2s steps(1) infinite 1s}
@keyframes tw{0%{opacity:1}50%{opacity:.15}}
.jump{animation:jump 1.6s steps(1) infinite}
@keyframes jump{0%{transform:translateY(0)}65%{transform:translateY(-1px)}70%{transform:translateY(-4px)}85%{transform:translateY(-2px)}90%{transform:translateY(0)}}
.obs{animation:obs 1.6s steps(15) infinite}
@keyframes obs{0%{transform:translateX(0)}100%{transform:translateX(-15px)}}
.mouth{animation:mouth .4s steps(1) infinite}
@keyframes mouth{0%{opacity:1}50%{opacity:0}}
.btn{animation:btn .5s steps(1) infinite}
@keyframes btn{0%{fill:#3fb950}50%{fill:#f85149}}
.ha{animation:ha 1.2s steps(1) infinite}
@keyframes ha{0%{opacity:1}60%{opacity:0}}
.coin{animation:coin .6s steps(1) infinite}
@keyframes coin{0%{transform:scaleX(1)}50%{transform:scaleX(.4)}}
text{font-family:'Courier New',monospace;font-weight:bold}
</style>
<g transform="scale(8)">
<rect width="50" height="30" fill="#0d1117"/>
<rect class="tw" x="4" y="3" width="1" height="1" fill="#58a6ff"/>
<rect class="tw2" x="20" y="2" width="1" height="1" fill="#fff"/>
<rect class="tw" x="25" y="5" width="1" height="1" fill="#58a6ff"/>
<rect class="tw2" x="47" y="3" width="1" height="1" fill="#fff"/>
<rect class="tw" x="12" y="4" width="1" height="1" fill="#fff"/>
<rect class="tw2" x="2" y="10" width="1" height="1" fill="#58a6ff"/>
<rect y="24" width="50" height="6" fill="#161b22"/>
<rect x="3" y="25" width="26" height="4" fill="#b3263e"/>
<rect x="3" y="25" width="26" height="1" fill="#d6455d"/>
<!-- toolbox -->
<rect x="3" y="21" width="5" height="3" fill="#c0392b"/>
<rect x="4" y="20" width="3" height="1" fill="#7f8c8d"/>
<rect x="3" y="22" width="5" height="1" fill="#8e2a20"/>
<!-- TV -->
<rect x="27" y="5" width="20" height="16" fill="#30363d"/>
<rect x="28" y="6" width="18" height="13" fill="#04140d"/>
<rect x="31" y="21" width="12" height="2" fill="#30363d"/>
<rect x="28" y="17" width="18" height="2" fill="#58a6ff"/>
<text x="29" y="8.3" font-size="1.4" fill="#3fb950">1UP</text>
<text x="38" y="8.3" font-size="1.4" fill="#58a6ff" class="tw">SCORE</text>
<g class="coin"><rect x="38" y="11" width="2" height="2" fill="#f2cc60"/></g>
<g class="jump"><rect x="31" y="15" width="2" height="2" fill="#f0f6fc"/><rect x="32" y="15" width="1" height="1" fill="#0d1117"/></g>
<g class="obs"><rect x="44" y="15" width="1" height="2" fill="#f85149"/></g>
<!-- boy -->
<g class="bob">
<rect x="9" y="8" width="6" height="2" fill="#1b1b22"/>
<rect x="8" y="9" width="1" height="2" fill="#1b1b22"/>
<rect x="15" y="9" width="1" height="2" fill="#1b1b22"/>
<rect x="9" y="10" width="6" height="5" fill="#e0a97c"/>
<rect x="8" y="11" width="1" height="2" fill="#e0a97c"/>
<rect x="15" y="11" width="1" height="2" fill="#e0a97c"/>
<rect x="10" y="11" width="2" height="1" fill="#1b1b22"/>
<rect x="13" y="11" width="2" height="1" fill="#1b1b22"/>
<rect x="9" y="12" width="1" height="1" fill="#e57f6f"/>
<rect x="14" y="12" width="1" height="1" fill="#e57f6f"/>
<rect x="10" y="13" width="4" height="1" fill="#fff"/>
<rect class="mouth" x="11" y="14" width="2" height="1" fill="#7a1f1f"/>
<rect x="8" y="15" width="8" height="5" fill="#efe3c2"/>
<rect x="8" y="16" width="8" height="1" fill="#3b4a7a"/>
<rect x="8" y="18" width="8" height="1" fill="#3b4a7a"/>
<rect x="16" y="15" width="2" height="2" fill="#efe3c2"/>
<rect x="17" y="17" width="4" height="1" fill="#e0a97c"/>
<rect x="7" y="16" width="1" height="3" fill="#e0a97c"/>
<rect x="20" y="16" width="5" height="3" fill="#2d333b"/>
<rect x="21" y="17" width="1" height="1" fill="#8b949e"/>
<rect class="btn" x="23" y="17" width="1" height="1" fill="#3fb950"/>
<rect x="8" y="20" width="8" height="2" fill="#d8c38a"/>
<rect x="9" y="22" width="2" height="2" fill="#e0a97c"/>
<rect x="13" y="22" width="2" height="2" fill="#e0a97c"/>
</g>
<text class="ha" x="14" y="6.5" font-size="1.6" fill="#58a6ff">HA HA!</text>
<text x="25" y="28.6" font-size="1.4" fill="#8b949e" text-anchor="middle">PLAYER 1 · FOUNDER MODE</text>
</g>
</svg>
