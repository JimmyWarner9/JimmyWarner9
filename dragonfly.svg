<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 96" width="800" shape-rendering="crispEdges" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.fly{animation:fly 7s steps(62) infinite}
@keyframes fly{0%{transform:translateX(-12px)}100%{transform:translateX(52px)}}
.bob{animation:bob .9s steps(1) infinite}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(1px)}}
.w1{animation:w1 .2s steps(1) infinite}
.w2{animation:w2 .2s steps(1) infinite}
@keyframes w1{0%{opacity:1}50%{opacity:0}}
@keyframes w2{0%{opacity:0}50%{opacity:1}}
.tw{animation:tw 2s steps(1) infinite}
.tw2{animation:tw 2s steps(1) infinite 1s}
@keyframes tw{0%{opacity:.9}50%{opacity:.1}}
text{font-family:'Courier New',monospace;font-weight:bold}
</style>
<g transform="scale(8)">
<rect class="tw" x="6" y="2" width="1" height="1" fill="#58a6ff"/>
<rect class="tw2" x="18" y="9" width="1" height="1" fill="#58a6ff"/>
<rect class="tw" x="30" y="3" width="1" height="1" fill="#3fb950"/>
<rect class="tw2" x="42" y="8" width="1" height="1" fill="#58a6ff"/>
<rect class="tw" x="24" y="1" width="1" height="1" fill="#8b949e"/>
<rect x="0" y="11" width="50" height="1" fill="#58a6ff" opacity=".35"/>
<g class="fly"><g class="bob">
<!-- abdomen -->
<rect x="-2" y="6" width="1" height="1" fill="#1f8a85"/>
<rect x="-1" y="6" width="1" height="1" fill="#2ea6a0"/>
<rect x="0" y="6" width="1" height="1" fill="#1f8a85"/>
<rect x="1" y="6" width="1" height="1" fill="#2ea6a0"/>
<rect x="2" y="6" width="1" height="1" fill="#1f8a85"/>
<rect x="3" y="6" width="1" height="1" fill="#2ea6a0"/>
<rect x="4" y="6" width="1" height="1" fill="#1f8a85"/>
<!-- thorax -->
<rect x="5" y="5" width="3" height="3" fill="#2ea6a0"/>
<rect x="5" y="5" width="3" height="1" fill="#58d6cf"/>
<!-- head -->
<rect x="8" y="5" width="2" height="3" fill="#2ea6a0"/>
<rect x="9" y="5" width="1" height="1" fill="#f85149"/>
<rect x="9" y="7" width="1" height="1" fill="#f85149"/>
<!-- legs -->
<rect x="6" y="8" width="1" height="1" fill="#1f8a85"/>
<rect x="7" y="8" width="1" height="1" fill="#1f8a85"/>
<!-- wings up -->
<g class="w1" fill="#58a6ff" opacity=".8">
<rect x="4" y="2" width="4" height="1"/><rect x="5" y="3" width="3" height="1"/><rect x="6" y="4" width="1" height="1"/>
<rect x="1" y="3" width="3" height="1" opacity=".6"/>
</g>
<!-- wings down -->
<g class="w2" fill="#58a6ff" opacity=".8">
<rect x="4" y="9" width="4" height="1"/><rect x="5" y="8" width="3" height="1"/>
<rect x="1" y="8" width="3" height="1" opacity=".6"/>
<rect x="5" y="4" width="3" height="1" opacity=".5"/>
</g>
</g></g>
<text x="25" y="10.4" font-size="1.3" fill="#8b949e" text-anchor="middle">KEEP BUILDING · KEEP FLYING</text>
</g>
</svg>
