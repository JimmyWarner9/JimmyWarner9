<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#0b2a3a;#1a1033;#0d1117" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0b2a3a">
        <animate attributeName="stop-color" values="#0b2a3a;#1a1033;#0d1117;#0b2a3a" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .star { fill:#fff; animation: twinkle 2.6s infinite ease-in-out; }
      .d1 { animation-delay:.4s; } .d2 { animation-delay:.9s; } .d3 { animation-delay:1.5s; } .d4 { animation-delay:2s; }
      @keyframes twinkle { 0%,100%{opacity:.08} 50%{opacity:.95} }
      .title { font: 700 62px 'Segoe UI', Arial, sans-serif; fill:#fff; }
      .sub { font: 400 28px 'Segoe UI', Arial, sans-serif; fill:#22d3ee; }
      .pulse { fill:none; stroke:#22d3ee; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
    </style>
  </defs>

  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>

  <!-- twinkling pixel stars -->
  <rect class="star" x="120" y="30" width="4" height="4"/>
  <rect class="star d1" x="410" y="55" width="4" height="4"/>
  <rect class="star d2" x="690" y="28" width="4" height="4"/>
  <rect class="star d3" x="880" y="70" width="4" height="4"/>
  <rect class="star d4" x="950" y="140" width="4" height="4"/>
  <rect class="star d2" x="60" y="95" width="3" height="3"/>
  <rect class="star d3" x="560" y="40" width="3" height="3"/>
  <rect class="star d1" x="800" y="110" width="3" height="3"/>
  <rect class="star d4" x="300" y="22" width="3" height="3"/>
  <rect class="star" x="930" y="30" width="3" height="3"/>
  <rect class="star d2" x="620" y="245" width="3" height="3"/>
  <rect class="star d3" x="90" y="255" width="3" height="3"/>

  <text class="title" x="50" y="120">Muhammad Hakimi</text>
  <text class="sub" x="52" y="165">AI / ML Engineer</text>

  <!-- heartbeat line -->
  <path id="beat" class="pulse" filter="url(#glow)"
        d="M50 225 H330 L350 205 L370 250 L395 185 L420 225 H560 L580 212 L600 225 H720 L745 200 L770 235 L790 225 H950"/>

  <!-- travelling dot -->
  <circle r="7" fill="#f5a623" stroke="#22d3ee" stroke-width="2" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite" rotate="0">
      <mpath href="#beat"/>
    </animateMotion>
  </circle>
</svg>
