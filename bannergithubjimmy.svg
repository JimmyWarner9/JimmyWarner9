<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Muhammad Hakimi: AI/ML Engineer, Cybersecurity, Co-Founder at Jimmy Warner Network" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .name { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 52px; font-weight: 700; letter-spacing: -0.5px; fill: #e8eef5; opacity: 0; animation: fadein 0.8s ease-out 0.2s forwards; }
    .role { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-size: 26px; fill: #5fd3e6; opacity: 0; animation: cycle 9s ease-in-out infinite; }
    .r1 { animation-delay: 0.6s; }
    .r2 { animation-delay: 3.6s; }
    .r3 { animation-delay: 6.6s; }
    .trace { fill: none; stroke: #5fd3e6; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2.6s ease-out 0.3s forwards; }
    .base { stroke: #1d2f47; stroke-width: 1.5; }
    .dot { fill: #f2b35e; opacity: 0; animation: fadein 0.3s ease-out 2.8s forwards; }
    .ring { fill: none; stroke: #f2b35e; stroke-width: 1.5; opacity: 0; animation: pulse 2.4s ease-in-out 3.1s infinite; }
    @keyframes fadein { to { opacity: 1; } }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes cycle { 0% { opacity: 0; } 5% { opacity: 1; } 30% { opacity: 1; } 35% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes pulse { 0% { opacity: 0.7; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .name, .dot, .r1 { animation: none; opacity: 1; }
      .r2, .r3, .ring { animation: none; opacity: 0; }
      .trace { animation: none; stroke-dashoffset: 0; }
    }
  </style>
  <rect width="1000" height="240" rx="16" fill="#0e1a2b"/>
  <text class="name" x="60" y="96">Muhammad Hakimi</text>
  <text class="role r1" x="62" y="140">AI / ML Engineer</text>
  <text class="role r2" x="62" y="140">Cybersecurity</text>
  <text class="role r3" x="62" y="140">Co-Founder, Jimmy Warner Network</text>
  <line class="base" x1="60" y1="190" x2="940" y2="190"/>
  <path class="trace" pathLength="1000" d="M60,190 H300 L330,190 L350,160 L372,215 L398,140 L424,190 H560 L580,175 L600,190 H720 L745,165 L768,205 L790,190 H940"/>
  <circle class="dot" cx="940" cy="190" r="5"/>
  <circle class="ring" cx="940" cy="190" r="11"/>
</svg>
