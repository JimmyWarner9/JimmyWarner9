<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"><animate attributeName="stop-color" values="#0d1117;#0b2a3a;#1a1033;#0d1117" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#0b2a3a"><animate attributeName="stop-color" values="#0b2a3a;#1a1033;#0d1117;#0b2a3a" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <clipPath id="clipA"><rect width="1000" height="280" rx="18"/></clipPath>
    <filter id="blurA"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glowA" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="gridA" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity=".13" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 0" dur="3s" repeatCount="indefinite"/>
    </pattern>
    <g id="starsA"><rect class="st d0" x="331" y="77" width="4" height="4"/><rect class="st d1" x="666" y="24" width="2" height="2"/><rect class="st d2" x="840" y="274" width="2" height="2"/><rect class="st d3" x="374" y="29" width="3" height="3"/><rect class="st d4" x="38" y="44" width="4" height="4"/><rect class="st d0" x="428" y="35" width="3" height="3"/><rect class="st d1" x="92" y="217" width="2" height="2"/><rect class="st d2" x="846" y="63" width="3" height="3"/><rect class="st d3" x="645" y="31" width="4" height="4"/><rect class="st d4" x="50" y="113" width="2" height="2"/><rect class="st d0" x="570" y="68" width="3" height="3"/><rect class="st d1" x="429" y="73" width="2" height="2"/><rect class="st d2" x="584" y="157" width="3" height="3"/><rect class="st d3" x="105" y="96" width="3" height="3"/><rect class="st d4" x="99" y="32" width="2" height="2"/><rect class="st d0" x="633" y="105" width="4" height="4"/><rect class="st d1" x="696" y="272" width="4" height="4"/><rect class="st d2" x="795" y="160" width="4" height="4"/><rect class="st d3" x="599" y="232" width="3" height="3"/><rect class="st d4" x="306" y="127" width="3" height="3"/><rect class="st d0" x="715" y="124" width="2" height="2"/><rect class="st d1" x="588" y="153" width="4" height="4"/><rect class="st d2" x="896" y="175" width="4" height="4"/><rect class="st d3" x="294" y="37" width="2" height="2"/><rect class="st d4" x="524" y="214" width="3" height="3"/><rect class="st d0" x="775" y="175" width="3" height="3"/><rect class="st d1" x="955" y="250" width="4" height="4"/><rect class="st d2" x="40" y="39" width="3" height="3"/><rect class="st d3" x="348" y="179" width="4" height="4"/><rect class="st d4" x="593" y="233" width="2" height="2"/><rect class="st d0" x="860" y="47" width="3" height="3"/><rect class="st d1" x="485" y="33" width="2" height="2"/><rect class="st d2" x="748" y="158" width="4" height="4"/><rect class="st d3" x="291" y="197" width="3" height="3"/></g>
    <style>
      .st{fill:#fff;animation:tw 2.6s infinite ease-in-out}
      .d1{animation-delay:.5s}.d2{animation-delay:1s}.d3{animation-delay:1.6s}.d4{animation-delay:2.1s}
      @keyframes tw{0%,100%{opacity:.1}50%{opacity:.95}}
      .title{font:700 62px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .sub{font:400 28px 'Segoe UI',Arial,sans-serif;fill:#22d3ee}
      .txt{font:700 27px 'Segoe UI',Arial,sans-serif;fill:#fff}.hl{fill:#22d3ee}
      .pulse{fill:none;stroke:#22d3ee;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    </style>
  </defs>
  <g clip-path="url(#clipA)">
    <rect width="1000" height="280" fill="url(#bgA)"/>
    <g filter="url(#blurA)" opacity=".55">
      <ellipse cx="200.0" cy="224.0" rx="200" ry="70" fill="#22d3ee"><animateTransform attributeName="transform" type="translate" values="0 0;500.0 -30;0 0" dur="14s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="800.0" cy="56.0" rx="220" ry="70" fill="#7c3aed"><animateTransform attributeName="transform" type="translate" values="0 0;-500.0 40;0 0" dur="18s" repeatCount="indefinite"/></ellipse>
    </g>
    <rect width="1000" height="280" fill="url(#gridA)"/>
    <use href="#starsA"><animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="60s" repeatCount="indefinite"/></use>
    <use href="#starsA"><animateTransform attributeName="transform" type="translate" from="1000 0" to="0 0" dur="60s" repeatCount="indefinite"/></use>
    <line x1="0" y1="0" x2="60" y2="24" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="-100 20;1100 168.0;1100 168.0" keyTimes="0;.18;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.03;.18;1" dur="7s" repeatCount="indefinite"/>
    </line>
    <rect width="1000" height="3" fill="#22d3ee" opacity=".10"><animate attributeName="y" from="-5" to="280" dur="5s" repeatCount="indefinite"/></rect>
  </g>
  <text class="title" x="50" y="120">Muhammad Hakimi</text>
  <text class="sub" x="52" y="165">AI / ML Engineer</text>
  <path id="beat" class="pulse" filter="url(#glowA)" d="M50 225 H330 L350 205 L370 250 L395 185 L420 225 H560 L580 212 L600 225 H720 L745 200 L770 235 L790 225 H950"/>
  <circle r="7" fill="#f5a623" stroke="#22d3ee" stroke-width="2" filter="url(#glowA)"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#beat"/></animateMotion></circle>
</svg>