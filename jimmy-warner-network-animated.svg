<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="100%" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Jimmy Warner Network animated banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080f"/>
      <stop offset="0.55" stop-color="#0a1426"/>
      <stop offset="0.85" stop-color="#3a1a10"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="1" r="0.8">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globe" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#7a3a14"/>
      <stop offset="0.6" stop-color="#1a0f0b"/>
      <stop offset="1" stop-color="#05070c"/>
    </radialGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#ffa43a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <clipPath id="globeClip"><circle cx="1380" cy="330" r="190"/></clipPath>
    <clipPath id="titleClip"><rect x="470" y="150" width="760" height="110"/></clipPath>
  </defs>

  <style>
    .t-white{font:900 84px 'Orbitron','Montserrat','Arial Black',sans-serif;fill:#e9edf5;letter-spacing:2px}
    .t-orange{font:900 84px 'Orbitron','Montserrat','Arial Black',sans-serif;fill:url(#orange);letter-spacing:2px}
    .t-net{font:500 30px 'Montserrat','Arial',sans-serif;fill:#dfe6f2;letter-spacing:26px}
    .t-tag{font:700 13px 'Montserrat','Arial',sans-serif;fill:#e6ebf4;letter-spacing:5px}
    .t-tag b{fill:#ff8a1f}
    .t-small{font:600 11px 'Montserrat','Arial',sans-serif;fill:#b9c3d6;letter-spacing:3px}
    .cloud{fill:#0d1626;opacity:.7}
    .drift1{animation:drift 60s linear infinite}
    .drift2{animation:drift 90s linear infinite reverse}
    .stripe{animation:slide 5s ease-in-out infinite alternate}
    .spin{transform-origin:1380px 330px;animation:rot 40s linear infinite}
    .ring{transform-origin:290px 255px;animation:rot 12s linear infinite}
    .ring2{transform-origin:290px 255px;animation:rot 18s linear infinite reverse}
    .pulse{transform-origin:290px 255px;animation:pulse 3s ease-in-out infinite}
    .twinkle{animation:tw 3s ease-in-out infinite}
    .sweep{animation:sweep 6s ease-in-out infinite}
    .flow{stroke-dasharray:6 10;animation:dash 2s linear infinite}
    .fade-in{animation:fadeUp 1.4s ease-out both}
    .horizon{animation:breathe 5s ease-in-out infinite}
    @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-400px)}}
    @keyframes slide{from{transform:translateX(-20px)}to{transform:translateX(40px)}}
    @keyframes rot{to{transform:rotate(360deg)}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.18);opacity:1}}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
    @keyframes sweep{0%{transform:translateX(-300px)}60%,100%{transform:translateX(900px)}}
    @keyframes dash{to{stroke-dashoffset:-32}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <!-- Sky -->
  <rect width="1600" height="500" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#fff">
    <circle class="twinkle" cx="120" cy="60" r="1.4"/>
    <circle class="twinkle" style="animation-delay:.6s" cx="420" cy="35" r="1.1"/>
    <circle class="twinkle" style="animation-delay:1.2s" cx="760" cy="80" r="1.3"/>
    <circle class="twinkle" style="animation-delay:1.8s" cx="1010" cy="40" r="1.2"/>
    <circle class="twinkle" style="animation-delay:.3s" cx="1210" cy="95" r="1.5"/>
    <circle class="twinkle" style="animation-delay:2.1s" cx="1500" cy="50" r="1.2"/>
    <circle class="twinkle" style="animation-delay:1s" cx="620" cy="30" r="1"/>
    <circle class="twinkle" style="animation-delay:2.5s" cx="300" cy="100" r="1"/>
  </g>

  <!-- Clouds -->
  <g class="drift1">
    <ellipse class="cloud" cx="200" cy="120" rx="240" ry="22"/>
    <ellipse class="cloud" cx="700" cy="90" rx="200" ry="16"/>
    <ellipse class="cloud" cx="1200" cy="130" rx="260" ry="20"/>
    <ellipse class="cloud" cx="1700" cy="110" rx="230" ry="18"/>
  </g>
  <g class="drift2" opacity=".6">
    <ellipse class="cloud" cx="450" cy="190" rx="300" ry="14"/>
    <ellipse class="cloud" cx="1100" cy="210" rx="280" ry="14"/>
    <ellipse class="cloud" cx="1750" cy="195" rx="300" ry="14"/>
  </g>

  <!-- Horizon glow -->
  <rect y="300" width="1600" height="200" fill="url(#glow)" class="horizon"/>
  <path d="M0 470 L120 455 L260 468 L420 450 L600 466 L800 452 L1000 468 L1200 454 L1400 466 L1600 456 L1600 500 L0 500Z" fill="#06080d"/>
  <rect y="466" width="1600" height="3" fill="#ff9a3a" opacity=".8" class="horizon" filter="url(#soft)"/>

  <!-- Orange corner stripes -->
  <g class="stripe">
    <polygon points="-60,0 120,0 -60,150" fill="#ff5a00"/>
    <polygon points="140,0 200,0 -60,210 -60,170" fill="#c94400" opacity=".85"/>
    <polygon points="220,0 280,0 -60,270 -60,230" fill="#7a2a08" opacity=".7"/>
  </g>

  <!-- Globe -->
  <g>
    <circle cx="1380" cy="330" r="200" fill="#ff7a1a" opacity=".25" filter="url(#blur)" class="horizon"/>
    <circle cx="1380" cy="330" r="190" fill="url(#globe)"/>
    <g clip-path="url(#globeClip)">
      <g class="spin" fill="none" stroke="#ff8a2a" stroke-width="1" opacity=".7">
        <ellipse cx="1380" cy="330" rx="190" ry="60"/>
        <ellipse cx="1380" cy="330" rx="190" ry="120"/>
        <ellipse cx="1380" cy="330" rx="60" ry="190"/>
        <ellipse cx="1380" cy="330" rx="120" ry="190"/>
        <line x1="1190" y1="330" x2="1570" y2="330"/>
        <line x1="1380" y1="140" x2="1380" y2="520"/>
        <path class="flow" d="M1230 280 Q1330 200 1420 260 T1560 300" stroke="#ffd28a" stroke-width="1.6"/>
        <path class="flow" style="animation-duration:3s" d="M1210 380 Q1320 330 1400 400 T1540 370" stroke="#ffd28a" stroke-width="1.6"/>
        <path class="flow" style="animation-duration:2.5s" d="M1300 200 Q1380 280 1330 400" stroke="#ffd28a" stroke-width="1.6"/>
        <g fill="#ffd28a" stroke="none">
          <circle class="twinkle" cx="1230" cy="280" r="3.5"/>
          <circle class="twinkle" style="animation-delay:.7s" cx="1420" cy="260" r="3.5"/>
          <circle class="twinkle" style="animation-delay:1.4s" cx="1400" cy="400" r="3.5"/>
          <circle class="twinkle" style="animation-delay:2s" cx="1330" cy="400" r="3"/>
          <circle class="twinkle" style="animation-delay:1s" cx="1540" cy="370" r="3"/>
        </g>
      </g>
    </g>
    <circle cx="1380" cy="330" r="190" fill="none" stroke="#ffb066" stroke-width="2" opacity=".6"/>
  </g>

  <!-- Shield emblem -->
  <g>
    <circle class="pulse" cx="290" cy="255" r="92" fill="none" stroke="#ff8a2a" stroke-width="2"/>
    <circle cx="290" cy="255" r="78" fill="#0c1220"/>
    <circle class="ring" cx="290" cy="255" r="84" fill="none" stroke="#ff7a1a" stroke-width="8" stroke-dasharray="190 340" stroke-linecap="round"/>
    <circle class="ring2" cx="290" cy="255" r="84" fill="none" stroke="#29b6ff" stroke-width="4" stroke-dasharray="90 440" stroke-linecap="round"/>
    <!-- helmet -->
    <path d="M250 225 Q290 195 330 225 L330 270 Q330 305 290 325 Q250 305 250 270Z" fill="#aeb8c9" stroke="#e9edf5" stroke-width="2"/>
    <path d="M262 245 L318 245 L318 258 L304 258 L304 292 L276 292 L276 258 L262 258Z" fill="#232c3d"/>
    <path d="M290 200 L290 245" stroke="#e9edf5" stroke-width="3"/>
    <circle cx="290" cy="210" r="6" fill="#29b6ff" class="twinkle"/>
  </g>

  <!-- Title -->
  <g class="fade-in">
    <text class="t-white" x="470" y="235">JIMMY</text>
    <text class="t-orange" x="738" y="235">WARNER</text>
    <g clip-path="url(#titleClip)">
      <rect class="sweep" x="470" y="150" width="120" height="110" fill="url(#shine)" transform="skewX(-20)"/>
    </g>
    <text class="t-net" x="548" y="285">NETWORK</text>
    <line x1="470" y1="262" x2="1230" y2="262" stroke="#ff7a1a" stroke-width="2" opacity=".9"/>
    <text class="t-tag" x="470" y="332" textLength="760" lengthAdjust="spacing">SHREDDING THE DIGITAL FRONTIER WITH <tspan class="t-tag" fill="#ff8a1f" style="fill:#ff8a1f">JIMMY WARNER NETWORK.</tspan></text>
    <text class="t-tag" x="520" y="362" textLength="660" lengthAdjust="spacing">EMPOWERING AI CYBERSECURITY DEFENSES.</text>
  </g>

  <!-- Top-right descriptor -->
  <g class="fade-in" style="animation-delay:.6s">
    <line x1="1000" y1="70" x2="1000" y2="112" stroke="#ff7a1a" stroke-width="2"/>
    <text class="t-small" x="1014" y="80">AI-POWERED SECURITY</text>
    <text class="t-small" x="1014" y="97">THREAT INTELLIGENCE</text>
    <text class="t-small" x="1014" y="114">GLOBAL PROTECTION</text>
  </g>
</svg>
