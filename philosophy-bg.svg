<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"><animate attributeName="stop-color" values="#0d1117;#0b2a3a;#1a1033;#0d1117" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#0b2a3a"><animate attributeName="stop-color" values="#0b2a3a;#1a1033;#0d1117;#0b2a3a" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <clipPath id="clipB"><rect width="900" height="180" rx="18"/></clipPath>
    <filter id="blurB"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glowB" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="gridB" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity=".13" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 0" dur="3s" repeatCount="indefinite"/>
    </pattern>
    <g id="starsB"><rect class="st d0" x="331" y="38" width="4" height="4"/><rect class="st d1" x="666" y="12" width="2" height="2"/><rect class="st d2" x="840" y="137" width="2" height="2"/><rect class="st d3" x="374" y="149" width="2" height="2"/><rect class="st d4" x="519" y="54" width="2" height="2"/><rect class="st d0" x="88" y="111" width="4" height="4"/><rect class="st d1" x="71" y="61" width="2" height="2"/><rect class="st d2" x="564" y="108" width="2" height="2"/><rect class="st d3" x="846" y="144" width="2" height="2"/><rect class="st d4" x="228" y="161" width="2" height="2"/><rect class="st d0" x="590" y="149" width="4" height="4"/><rect class="st d1" x="50" y="56" width="2" height="2"/><rect class="st d2" x="570" y="34" width="3" height="3"/><rect class="st d3" x="429" y="36" width="2" height="2"/><rect class="st d4" x="584" y="78" width="3" height="3"/><rect class="st d0" x="105" y="148" width="3" height="3"/><rect class="st d1" x="381" y="24" width="2" height="2"/><rect class="st d2" x="577" y="15" width="3" height="3"/><rect class="st d3" x="508" y="174" width="4" height="4"/><rect class="st d4" x="795" y="80" width="4" height="4"/><rect class="st d0" x="599" y="116" width="3" height="3"/><rect class="st d1" x="306" y="63" width="3" height="3"/><rect class="st d2" x="715" y="62" width="2" height="2"/><rect class="st d3" x="588" y="76" width="4" height="4"/><rect class="st d4" x="896" y="87" width="4" height="4"/><rect class="st d0" x="294" y="155" width="2" height="2"/><rect class="st d1" x="120" y="131" width="4" height="4"/><rect class="st d2" x="168" y="87" width="3" height="3"/><rect class="st d3" x="500" y="107" width="2" height="2"/><rect class="st d4" x="684" y="19" width="3" height="3"/><rect class="st d0" x="348" y="177" width="3" height="3"/><rect class="st d1" x="608" y="127" width="4" height="4"/><rect class="st d2" x="70" y="23" width="3" height="3"/><rect class="st d3" x="485" y="178" width="2" height="2"/></g>
    <style>
      .st{fill:#fff;animation:tw 2.6s infinite ease-in-out}
      .d1{animation-delay:.5s}.d2{animation-delay:1s}.d3{animation-delay:1.6s}.d4{animation-delay:2.1s}
      @keyframes tw{0%,100%{opacity:.1}50%{opacity:.95}}
      .title{font:700 62px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .sub{font:400 28px 'Segoe UI',Arial,sans-serif;fill:#22d3ee}
      .txt{font:700 27px 'Segoe UI',Arial,sans-serif;fill:#fff}.hl{fill:#22d3ee}
      .pulse{fill:none;stroke:#22d3ee;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
    </style>
  </defs>
  <g clip-path="url(#clipB)">
    <rect width="900" height="180" fill="url(#bgB)"/>
    <g filter="url(#blurB)" opacity=".55">
      <ellipse cx="180.0" cy="144.0" rx="200" ry="70" fill="#22d3ee"><animateTransform attributeName="transform" type="translate" values="0 0;450.0 -30;0 0" dur="14s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="720.0" cy="36.0" rx="220" ry="70" fill="#7c3aed"><animateTransform attributeName="transform" type="translate" values="0 0;-450.0 40;0 0" dur="18s" repeatCount="indefinite"/></ellipse>
    </g>
    <rect width="900" height="180" fill="url(#gridB)"/>
    <use href="#starsB"><animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="60s" repeatCount="indefinite"/></use>
    <use href="#starsB"><animateTransform attributeName="transform" type="translate" from="900 0" to="0 0" dur="60s" repeatCount="indefinite"/></use>
    <line x1="0" y1="0" x2="60" y2="24" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0">
      <animateTransform attributeName="transform" type="translate" values="-100 20;1000 108.0;1000 108.0" keyTimes="0;.18;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.03;.18;1" dur="7s" repeatCount="indefinite"/>
    </line>
    <rect width="900" height="3" fill="#22d3ee" opacity=".10"><animate attributeName="y" from="-5" to="180" dur="5s" repeatCount="indefinite"/></rect>
  </g>
  <text class="txt" x="450" y="98" text-anchor="middle">Learn <tspan class="hl">→</tspan> Build <tspan class="hl">→</tspan> Break <tspan class="hl">→</tspan> Fix <tspan class="hl">→</tspan> Improve <tspan class="hl">→</tspan> Ship <tspan class="hl">→</tspan> Repeat</text>
</svg>